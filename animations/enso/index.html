<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENSO 聖嬰－南方振盪 3D 示意動畫</title>
<style>
  :root {
    --bg: #07121f;
    --panel: rgba(10, 22, 38, 0.86);
    --line: rgba(160, 200, 240, 0.18);
    --text: #e6eef7;
    --muted: #9fb3c8;
    --neutral: #5b8db8;
    --elnino: #e0573a;
    --lanina: #2f7fe0;
    --panelW: 380px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif; }
  #app { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font-size: 13px; line-height: 1.25; padding: 2px 7px 3px; border-radius: 4px; background: rgba(5, 15, 28, 0.72);
    border: 1px solid var(--line); color: #fff; transition: opacity 0.4s; pointer-events: auto; }
  .label small { display: block; font-size: 10.5px; color: #b9cbe0; }
  .label.warm { border-color: rgba(255, 140, 90, 0.7); }
  .label.cold { border-color: rgba(110, 190, 255, 0.7); }
  .label.air  { border-color: rgba(255, 255, 255, 0.5); }
  .label.land { border-color: rgba(150, 210, 120, 0.7); }
  .label.pin { font-size: 11.5px; opacity: 0.85; }
  .label.pin small { color: #ffe9a8; font-size: 11px; }
  .label.pin.active { font-size: 13px; background: rgba(60, 40, 0, 0.85); border-color: #ffd34d; }
  .label.fire { border-color: rgba(255, 120, 40, 0.9); color: #ffcf9a; }

  #top { position: fixed; top: 14px; left: 16px; display: flex; flex-direction: column; gap: 10px; max-width: calc(100% - var(--panelW) - 30px); }
  #top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  #top h1 small { font-weight: 400; color: #d2deea; font-size: 13px; margin-left: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select, .file { font: inherit; font-size: 14px; color: var(--text); background: rgba(20, 38, 60, 0.92);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  select { padding: 6px 8px; font-size: 13px; }
  button:hover, .file:hover { border-color: rgba(200, 225, 255, 0.5); }
  button.state.active[data-state="neutral"] { background: var(--neutral); border-color: var(--neutral); }
  button.state.active[data-state="elnino"]  { background: var(--elnino);  border-color: var(--elnino); }
  button.state.active[data-state="lanina"]  { background: var(--lanina);  border-color: var(--lanina); }
  button.on { background: #3a5a7a; border-color: #8fb4d8; }
  button.small, .file { font-size: 12px; padding: 5px 10px; }
  .file input { display: none; }
  kbd { font-size: 11px; color: var(--muted); margin-left: 4px; font-family: inherit; }

  #panel { position: fixed; top: 0; right: 0; width: var(--panelW); height: 100%; overflow-y: auto;
    background: var(--panel); border-left: 1px solid var(--line); padding: 18px 20px 24px; }
  #panel h2 { margin: 0 0 4px; font-size: 22px; }
  #panel h2 small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  #panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #panel h3 { font-size: 15px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  #panel h3 small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel li { font-size: 14px; line-height: 1.6; margin-bottom: 6px; }
  #panel b { color: #ffd89a; }
  #panel i { color: var(--muted); font-style: normal; font-size: 12.5px; }
  #panel .note { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  #panel .note a { color: #9cc8ff; word-break: break-all; }
  #panel .databox { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
  #panel .databox .v { font-size: 20px; font-weight: 600; }
  #panel sup a { color: #9cc8ff; text-decoration: none; font-size: 10px; }
  #panel .evt { font-size: 13px; line-height: 1.55; margin: 0 0 9px; padding: 2px 0 2px 9px; border-left: 3px solid rgba(255,255,255,0.6); }
  #panel .evt.tw { border-left-color: #ffd34d; }
  #panel .evt.now { background: rgba(255,255,255,0.06); }
  #panel .evt .when { color: var(--muted); font-size: 12px; }
  #panel .evt .tag { font-size: 11px; color: var(--muted); }
  #panel .evt a.jump { color: #9cc8ff; cursor: pointer; font-size: 12px; margin-left: 4px; }
  #panel details summary { cursor: pointer; font-size: 13px; color: #d2deea; margin: 6px 0; }
  #panel ol.refs { padding-left: 22px; margin: 0; }
  #panel ol.refs li { font-size: 12px; line-height: 1.5; margin-bottom: 5px; color: #c6d3e0; }
  #panel ol.refs li a { color: #9cc8ff; word-break: break-all; }
  #panel ol.refs li:target { background: rgba(255, 211, 77, 0.15); }
  #tip { position: fixed; z-index: 50; max-width: 340px; background: rgba(8, 18, 32, 0.96); border: 1px solid rgba(160, 200, 240, 0.45);
    border-radius: 6px; padding: 9px 11px; font-size: 13px; line-height: 1.55; color: var(--text); pointer-events: none;
    opacity: 0; transition: opacity 0.15s; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
  #tip.show { opacity: 1; }
  #tip .en { color: var(--muted); margin-left: 6px; font-size: 12px; }
  #tip .src { color: var(--muted); font-size: 11.5px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 4px; }
  [data-term] { cursor: help; }
  #panel b[data-term], #panel h2 [data-term], .label[data-term] > span, .legend [data-term], h1 [data-term] {
    text-decoration: underline dotted rgba(255, 216, 154, 0.75); text-underline-offset: 3px; }
  .stateTag { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

  #bottom { position: fixed; left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; width: calc(100% - var(--panelW) - 32px); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  #layers label { font-size: 12.5px; color: var(--text); display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; cursor: pointer; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-right: 14px; }
  .bar { width: 160px; height: 10px; border-radius: 5px; position: relative; }
  .bar.sst { background: linear-gradient(90deg, #1a40bf, #26a6d9, #f2d94d, #e6401f); }
  .bar.nino { background: linear-gradient(90deg, #2f7fe0, #dfe7ef, #e0573a); }
  #ninoMarker { position: absolute; top: -4px; width: 4px; height: 18px; background: #fff; border-radius: 2px;
    transform: translateX(-50%); box-shadow: 0 0 4px #000; }
  #databar { display: none; }
  #databar.show { display: block; }
  #timeline { width: 100%; height: 74px; display: block; margin-top: 8px; cursor: pointer; border-radius: 4px; background: rgba(0,0,0,0.25); }
  #readout { font-size: 13px; color: var(--text); margin-left: 6px; }
  #readout b { font-size: 15px; }

  @media (max-width: 900px) {
    :root { --panelW: 0px; }
    #panel { top: auto; bottom: 0; width: 100%; height: 34%; border-left: none; border-top: 1px solid var(--line); }
    #bottom { bottom: calc(34% + 8px); }
  }
</style>

<body>
<div id="app"></div>
<div id="labels"></div>
<div id="tip"></div>

<div id="top">
  <h1><span data-term="enso">ENSO 聖嬰－南方振盪</span><small>El Niño–Southern Oscillation｜赤道太平洋 3D 示意</small></h1>
  <div class="row">
    <button class="state" data-state="neutral" data-term="enso">正常年 Neutral<kbd>1</kbd></button>
    <button class="state" data-state="elnino" data-term="elnino">聖嬰 El Niño<kbd>2</kbd></button>
    <button class="state" data-state="lanina" data-term="lanina">反聖嬰 La Niña<kbd>3</kbd></button>
    <button id="autoBtn">自動循環 Auto<kbd>A</kbd></button>
    <button id="dataBtn">資料模式 Data<kbd>D</kbd></button>
    <button id="pauseBtn">暫停 Pause<kbd>空白鍵</kbd></button>
  </div>
  <div class="row">
    <button class="small" id="viewDefault">立體視角 3D view</button>
    <button class="small" id="viewSection">剖面視角 Cross-section</button>
    <button class="small" id="viewTop">俯視海溫 SST map</button>
    <button class="small" id="viewMap">世界地圖 World map</button>
    <button class="small" id="fsBtn">全螢幕 Fullscreen<kbd>F</kbd></button>
  </div>
</div>

<aside id="panel"></aside>

<div id="bottom">
  <div class="box" id="databar">
    <div class="row">
      <select id="idxSel" title="指數 Index"></select>
      <select id="evtSel" title="事件 Event"></select>
      <button class="small" id="playBtn">播放 Play</button>
      <select id="spdSel" title="速度 Speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
      </select>
      <label class="file">載入 CSV Load CSV<input type="file" id="csvFile" accept=".csv,text/csv"></label>
      <span id="readout"></span>
    </div>
    <canvas id="timeline"></canvas>
  </div>
  <div class="box">
    <div class="row" id="layers"></div>
    <div class="row" style="margin-top:6px">
      <div class="legend">≤20 °C<div class="bar sst"></div>30 °C　海表溫度 SST（OISST 1991–2020 年平均＋ENSO 距平示意）</div>
      <div class="legend"><span id="ninoLo">偏冷</span><div class="bar nino"><div id="ninoMarker"></div></div><span id="ninoHi">偏暖</span>　<span id="ninoText" data-term="nino34">Niño 3.4 海溫距平 SST anomaly（定性）</span></div>
    </div>
  </div>
</div>

function vnoise(x, y) {

{

// ---------- 觀測資料（CSV） ----------
const SEASONS = ['DJF', 'JFM', 'FMA', 'MAM', 'AMJ', 'MJJ', 'JJA', 'JAS', 'ASO', 'SON', 'OND', 'NDJ'];
const INDEX_NAMES = {
  roni: 'RONI 相對海洋聖嬰指數（Relative Oceanic Niño Index；NOAA 官方）',
  oni_v6: 'ONI 海洋聖嬰指數（Oceanic Niño Index, ERSSTv6）',
};
const data = { rows: [], cols: [], col: null, ep: [], pos: 0, playing: false, on: false };
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#'));
  const head = lines[0].split(',').map(s => s.trim().toLowerCase());
  const iy = head.indexOf('year');
  const is = head.indexOf('season');
  const im = ['center_month', 'month', 'mon'].map(k => head.indexOf(k)).find(i => i >= 0);
  if (iy < 0 || (is < 0 && im === undefined)) throw new Error('CSV 需要 year 與 season 或 month 欄位（requires year and season/month columns）');
  const skip = new Set([iy, is, im]);
  const cols = head.map((h, i) => i).filter(i => !skip.has(i));
  const rows = lines.slice(1).map(l => {
    const f = l.split(',').map(s => s.trim());
    const season = is >= 0 ? f[is] : '';
    const m = im !== undefined ? +f[im] : SEASONS.indexOf(season.toUpperCase()) + 1;
    const r = { year: +f[iy], m, label: `${f[iy]} ${season || String(m).padStart(2, '0')}`, v: {} };
    cols.forEach(i => { r.v[head[i]] = f[i] === '' ? NaN : +f[i]; });
    return r;
  }).filter(r => Number.isFinite(r.year));
  rows.sort((a, b) => a.year - b.year || a.m - b.m);
  const numCols = cols.map(i => head[i]).filter(c => rows.some(r => Number.isFinite(r.v[c])));
  return { rows, cols: numCols };
}
// 依 NOAA CPC 定義：連續 5 個重疊季達 ±0.5 °C 門檻才列為事件
function episodes(vals) {
  const ep = new Int8Array(vals.length);
  let i = 0;
  while (i < vals.length) {
    const s = vals[i] >= 0.5 ? 1 : vals[i] <= -0.5 ? -1 : 0;
    if (!s) { i++; continue; }
    let j = i;
    while (j < vals.length && (s > 0 ? vals[j] >= 0.5 : vals[j] <= -0.5)) j++;
    if (j - i >= 5) ep.fill(s, i, j);
    i = j;
  }
  return ep;
}
function loadData(text, sourceName) {
  const { rows, cols } = parseCSV(text);
  if (!rows.length || !cols.length) throw new Error('CSV 中沒有可用的數值欄位（no numeric index column）');
  data.rows = rows; data.cols = cols; data.source = sourceName;
  const sel = document.getElementById('idxSel');
  sel.innerHTML = cols.map(c => `<option value="${c}">${INDEX_NAMES[c] || c}</option>`).join('');
  selectColumn(cols.includes('roni') ? 'roni' : cols[0]);
  data.pos = Math.max(0, rows.length - 1);
  buildEvents();
}
function selectColumn(c) {
  data.col = c;
  document.getElementById('idxSel').value = c;
  data.vals = data.rows.map(r => r.v[c]);
  data.ep = episodes(data.vals);
  drawTimeline();
}
const EVENTS = [
  ['1982–83 聖嬰 El Niño', 1982, 1], ['1988–89 反聖嬰 La Niña', 1988, 1], ['1997–98 聖嬰 El Niño', 1997, 1],
  ['1998–2000 反聖嬰 La Niña', 1998, 3], ['2010–11 反聖嬰 La Niña', 2010, 1], ['2014–16 聖嬰 El Niño', 2014, 7],
  ['2020–23 反聖嬰 La Niña', 2020, 1], ['2023–24 聖嬰 El Niño', 2023, 3], ['2026 最新 Latest', 2026, 1],
];
function rowIndex(y, m) {
  let best = -1, bd = Infinity;
  data.rows.forEach((r, i) => { const d = Math.abs((r.year - y) * 12 + r.m - m); if (d < bd) { bd = d; best = i; } });
  return bd <= 3 ? best : -1;
}
function buildEvents() {
  const sel = document.getElementById('evtSel');
  const opts = EVENTS.map(([n, y, m]) => [n, data.rows.findIndex(r => r.year === y && r.m >= m)]).filter(e => e[1] >= 0);
  NEWS.forEach(e => { e.idx = rowIndex(e.y, e.m); });
  const news = NEWS.filter(e => e.idx >= 0);

function valueAt(pos) {
  const i = Math.floor(pos), f = pos - i;
  const a = data.vals[i], b = data.vals[Math.min(i + 1, data.vals.length - 1)];
  if (!Number.isFinite(a)) return Number.isFinite(b) ? b : 0;
  return Number.isFinite(b) ? a + (b - a) * f : a;
}
// 指數 → 模擬參數：±2 °C 以上視為完全的聖嬰／反聖嬰型態
function paramsFromIndex(v) {
  const w = Math.max(-1, Math.min(1, v / 2));
  const to = w >= 0 ? STATES.elnino : STATES.lanina, a = Math.abs(w);
  for (const k in STATES.neutral) target[k] = STATES.neutral[k] + (to[k] - STATES.neutral[k]) * a;
}

  if (ep < 0) return { key: 'lanina', txt: '反聖嬰事件 La Niña episode' };

const tl = document.getElementById('timeline');
function drawTimeline() {
  if (!data.rows.length) return;
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = tl.clientWidth, H = tl.clientHeight;
  if (!W) return;
  tl.width = W * dpr; tl.height = H * dpr;
  const g = tl.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const n = data.rows.length, pad = 26, top = 6, bot = H - 16, mid = (top + bot) / 2, sc = (bot - top) / 2 / 3;
  const xOf = i => pad + (W - pad - 6) * i / (n - 1);
  g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1;
  for (const t of [-2, -1, -0.5, 0.5, 1, 2]) { g.beginPath(); g.moveTo(pad, mid - t * sc); g.lineTo(W - 6, mid - t * sc); g.stroke(); }
  g.fillStyle = '#9fb3c8'; g.font = '10px sans-serif'; g.textAlign = 'right';
  for (const t of [-2, 0, 2]) g.fillText((t > 0 ? '+' : '') + t, pad - 4, mid - t * sc + 3);
  const bw = Math.max(1, (W - pad) / n);
  data.vals.forEach((v, i) => {
    if (!Number.isFinite(v)) return;
    const ep = data.ep[i];
    g.fillStyle = ep > 0 ? '#e0573a' : ep < 0 ? '#2f7fe0' : v >= 0.5 ? 'rgba(224,87,58,0.5)' : v <= -0.5 ? 'rgba(47,127,224,0.5)' : 'rgba(200,210,220,0.45)';
    const y = mid - Math.max(-3, Math.min(3, v)) * sc;
    g.fillRect(xOf(i) - bw / 2, Math.min(y, mid), bw, Math.abs(y - mid));
  });
  g.textAlign = 'center'; g.fillStyle = '#9fb3c8';
  data.rows.forEach((r, i) => { if (r.m === 1 && r.year % 10 === 0) { g.fillText(r.year, xOf(i), H - 3); } });
  for (const e of NEWS) {                                   // 新聞事件標記：★ 金色為臺灣
    if (!(e.idx >= 0)) continue;
    const ex = xOf(e.idx), ey = e.tw ? 9 : 3;
    g.fillStyle = e.tw ? '#ffd34d' : '#ffffff';
    g.beginPath(); g.moveTo(ex - 4, ey); g.lineTo(ex + 4, ey); g.lineTo(ex, ey + 6); g.closePath(); g.fill();
  }
  const x = xOf(data.pos);
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, top - 4); g.lineTo(x, bot + 2); g.stroke();
}
function seekFromEvent(e) {
  const r = tl.getBoundingClientRect(), pad = 26;
  const f = (e.clientX - r.left - pad) / (r.width - pad - 6);
  if (e.clientY - r.top < 16) {                              // 點擊事件標記
    const n = data.rows.length, hit = NEWS.filter(ev => ev.idx >= 0)
      .map(ev => [ev, Math.abs(pad + (r.width - pad - 6) * ev.idx / (n - 1) - (e.clientX - r.left))]).sort((a, b) => a[1] - b[1])[0];
    if (hit && hit[1] < 7) { data.pos = hit[0].idx; lastPanelKey = ''; return; }
  }
  data.pos = Math.max(0, Math.min(data.rows.length - 1, f * (data.rows.length - 1)));
  lastPanelKey = '';
}
let dragging = false;
tl.addEventListener('pointerdown', e => { dragging = true; tl.setPointerCapture(e.pointerId); seekFromEvent(e); });
tl.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
tl.addEventListener('pointerup', () => { dragging = false; });

// ---------- UI ----------
const panel = document.getElementById('panel');
const SOURCE_NOTE = `<div class="note"><b style="color:#d2deea">資料來源 Data source</b>：NOAA Climate Prediction Center（CPC）
  <br>ONI（ERSSTv6）：<a href="https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/oni/v6/" target="_blank" rel="noopener">cpc.ncep.noaa.gov/…/enso/oni/v6/</a>
  <br>RONI：<a href="https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/" target="_blank" rel="noopener">cpc.ncep.noaa.gov/…/enso/roni/</a>
  <br>RONI 為 Niño 3.4 區（5°N–5°S, 120°–170°W）海表溫度距平的 3 個月滑動平均，扣除熱帶（20°N–20°S）平均距平並調整變異量；NOAA CPC 以 ±0.5 °C 為門檻，連續 5 個重疊季達門檻才列為事件。依 NWS 公告 26-05，RONI 現為官方監測指標。最近數季數值為暫估，可能修正。擷取日期：2026-10-30。</div>`;
let lastPanelKey = '';
function renderPanel() {
  const phase = data.on && data.rows.length ? dataPhase(Math.round(data.pos)) : null;
  const key = phase ? phase.key : stateKey;
  const t = TEXT[key];
  let dataBox = '';
  if (phase) {
    const i = Math.round(data.pos), v = data.vals[i];
    dataBox = `<div class="databox">${data.rows[i].label}　${(INDEX_NAMES[data.col] || data.col).split('（')[0]}
      <div class="v" style="color:${t.color}">${Number.isFinite(v) ? (v > 0 ? '+' : '') + v.toFixed(1) + ' °C' : '—'}</div>${phase.txt}</div>`;
  }
  panel.innerHTML = `${dataBox}
    <h2><span class="stateTag" style="background:${t.color}"></span><span class="name">${t.name}</span><small>${t.en}</small></h2>
    <div class="sub">${t.sub}</div>
    <h3>海氣交互作用機制<small>Ocean–atmosphere coupling</small></h3>
    <ul>${t.mech.map(s => `<li>${s}</li>`).join('')}</ul>
    <h3>對生態系的影響<small>Ecological impacts</small></h3>
    <ul>${t.eco.map(s => `<li>${s}</li>`).join('')}</ul>
    <h3>臺灣的降雨影響<small>Impacts on Taiwan rainfall</small></h3>
    <ul>${TAIWAN[key].map(s => `<li>${s}</li>`).join('')}</ul>
    ${data.on ? eventsHTML() : ''}
    <div class="note">示意動畫，非實際觀測場；垂直尺度、海平面高低與各項強度皆經誇大以利說明。資料模式中，指數僅用來調整示意型態的強弱。
    視角：滑鼠左鍵旋轉、右鍵平移、滾輪縮放。底圖：Made with Natural Earth（公有領域）${R(37)}；陸地輪廓與底圖皆為真實海岸線；海色為 NOAA OISST v2.1 的 1991–2020 年平均海溫${R(35, 36)}，熱帶太平洋再疊加示意的 ENSO 距平（聖嬰／反聖嬰約 ±2.5 °C；資料模式中約等於指數值），非某日實際觀測；模型範圍（10°N–10°S）南北向放大 3 倍，模型外底圖為正常比例；地形高度為示意，事件地點為地區代表點。</div>
    ${data.on ? SOURCE_NOTE : ''}
    <h3>參考文獻<small>References</small></h3>
    <ol class="refs">${REFS.map((r, i) => `<li id="ref-${i + 1}">${r}</li>`).join('')}</ol>`;
  panel.querySelectorAll('li b, h2 .name').forEach(b => { const k = termOf(b.textContent); if (k) b.dataset.term = k; });
  panel.querySelectorAll('a.jump').forEach(a => a.addEventListener('click', () => { data.pos = +a.dataset.i; lastPanelKey = ''; }));
}
function eventHTML(e, now) {
  const tag = e.enso ? '來源明確連結 ENSO' : '來源未歸因於 ENSO';
  return `<div class="evt${e.tw ? ' tw' : ''}${now ? ' now' : ''}"><span class="when">${e.y}${e.tw ? '　★ 臺灣' : ''}</span>
    <a class="jump" data-i="${e.idx}">跳至 ▸</a><br><b>${e.zh}</b> <i>（${e.en}）</i><br>${e.note}${R(...e.ref)}
    <br><span class="tag">${tag}</span></div>`;
}
function eventsHTML() {
  const list = NEWS.filter(e => e.idx >= 0);
  const pos = Math.round(data.pos), near = list.filter(e => Math.abs(e.idx - pos) <= 4);
  return `<h3>此時期的事件<small>Events near this season</small></h3>
    ${near.length ? near.map(e => eventHTML(e, true)).join('') : '<div class="sub">前後一年內無收錄事件；時間軸上方的三角形為事件位置（金色為臺灣）。</div>'}
    <details><summary>全部收錄事件 All events（${list.length}）</summary>${list.map(e => eventHTML(e, false)).join('')}</details>`;
}
function setState(k) {
  stateKey = k;
  Object.assign(target, STATES[k]);
  document.querySelectorAll('button.state').forEach(b => b.classList.toggle('active', b.dataset.state === k));
  renderPanel();
}
function setDataMode(on) {
  data.on = on;
  document.getElementById('dataBtn').classList.toggle('on', on);
  document.getElementById('databar').classList.toggle('show', on);
  document.getElementById('ninoLo').textContent = on ? '−2.5' : '偏冷';
  document.getElementById('ninoHi').textContent = on ? '+2.5' : '偏暖';
  document.getElementById('ninoText').textContent = on ? 'Niño 3.4 海溫距平 SST anomaly（°C）' : 'Niño 3.4 海溫距平 SST anomaly（定性）';
  if (on) {
    stopAuto();
    document.querySelectorAll('button.state').forEach(b => b.classList.remove('active'));
    requestAnimationFrame(drawTimeline);
  } else {
    setPlaying(false);
    setState(stateKey);
  }
  lastPanelKey = '';
  renderPanel();
}
function setPlaying(p) {
  data.playing = p;
  const b = document.getElementById('playBtn');
  b.textContent = p ? '停止 Stop' : '播放 Play';
  b.classList.toggle('on', p);
  if (p && data.pos >= data.rows.length - 1) data.pos = 0;
}
document.querySelectorAll('button.state').forEach(b => b.addEventListener('click', () => { stopAuto(); if (data.on) setDataMode(false); setState(b.dataset.state); }));
document.getElementById('dataBtn').addEventListener('click', () => setDataMode(!data.on));
document.getElementById('playBtn').addEventListener('click', () => setPlaying(!data.playing));
document.getElementById('idxSel').addEventListener('change', e => { selectColumn(e.target.value); lastPanelKey = ''; });
document.getElementById('evtSel').addEventListener('change', e => {
  if (e.target.value === '') return;
  data.pos = +e.target.value; lastPanelKey = ''; setPlaying(true); e.target.value = '';
});
document.getElementById('csvFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => { loadData(t, f.name); data.pos = 0; lastPanelKey = ''; renderPanel(); })
    .catch(err => { console.error(err); document.getElementById('readout').textContent = '讀取失敗 Load failed：' + err.message; });
});

const layerBox = document.getElementById('layers');
LAYERS.forEach(l => {
  const lab = document.createElement('label');
  lab.innerHTML = `<input type="checkbox" checked> ${l.name}`;
  const term = termOf(l.name);
  if (term && l.key !== 'sst') lab.dataset.term = term;

  layerBox.appendChild(lab);
});

// 專有名詞提示框
const tip = document.getElementById('tip');
let tipEl = null;
function placeTip(x, y) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, x + 14) + 'px';
  tip.style.top = (y + 16 + r.height > window.innerHeight ? y - r.height - 12 : y + 16) + 'px';
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-term]');
  if (el === tipEl) return;
  tipEl = el;
  if (!el) { tip.classList.remove('show'); return; }
  const g = GLOSSARY[el.dataset.term];
  if (!g) return;
  tip.innerHTML = `<b>${g.zh}</b><span class="en">${g.en}</span><div>${g.def}</div>
    <div class="src">來源 Source：${g.ref.map(n => `[${n}] ` + REFS[n - 1].replace(/<[^>]+>/g, '').split(/https?:/)[0].trim()).join('<br>')}</div>`;
  tip.classList.add('show');
  placeTip(e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if (tipEl) placeTip(e.clientX, e.clientY); });

const SEQ = ['neutral', 'elnino', 'neutral', 'lanina'];
let autoTimer = null, seqIdx = 0;
const autoBtn = document.getElementById('autoBtn');
function startAuto() {
  if (data.on) setDataMode(false);
  seqIdx = Math.max(0, SEQ.indexOf(stateKey));
  autoTimer = setInterval(() => { seqIdx = (seqIdx + 1) % SEQ.length; setState(SEQ[seqIdx]); }, 10000);
  autoBtn.classList.add('on'); autoBtn.firstChild.textContent = '停止循環 Stop';
}
function stopAuto() {
  clearInterval(autoTimer); autoTimer = null;
  autoBtn.classList.remove('on'); autoBtn.firstChild.textContent = '自動循環 Auto';
}
autoBtn.addEventListener('click', () => autoTimer ? stopAuto() : startAuto());

let paused = false;
const pauseBtn = document.getElementById('pauseBtn');
function togglePause() {
  paused = !paused;
  pauseBtn.classList.toggle('on', paused);
  pauseBtn.firstChild.textContent = paused ? '繼續 Resume' : '暫停 Pause';
}
pauseBtn.addEventListener('click', togglePause);

function toggleFullscreen() {
  // 嵌入框架可能不允許全螢幕：攔截拒絕，不中斷動畫
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

let camTween = null;
function goView(name) {
  const v = VIEWS[name];
  camTween = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.target };
}
document.getElementById('viewDefault').addEventListener('click', () => goView('default'));
document.getElementById('viewSection').addEventListener('click', () => goView('section'));
document.getElementById('viewTop').addEventListener('click', () => goView('top'));
document.getElementById('viewMap').addEventListener('click', () => goView('map'));

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    stopAuto(); if (data.on) setDataMode(false); setState(['neutral', 'elnino', 'lanina'][+e.key - 1]);
  }
  else if (e.key === 'a' || e.key === 'A') autoTimer ? stopAuto() : startAuto();
  else if (e.key === 'd' || e.key === 'D') setDataMode(!data.on);
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  else if (data.on && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    data.pos = Math.max(0, Math.min(data.rows.length - 1, Math.round(data.pos) + (e.key === 'ArrowLeft' ? -1 : 1)));
    lastPanelKey = '';
  }
  else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  drawTimeline();
});

// ---------- 動畫迴圈 ----------
const clock = new THREE.Clock();
let simTime = 0;
const tmp = { x: 0, y: 0 };
const ninoMarker = document.getElementById('ninoMarker');
const readout = document.getElementById('readout');
let lastDrawnPos = -1;

function tick() {
  const realDt = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0 : realDt;
  simTime += dt;

  // 資料模式：依時間軸推進並以指數設定目標參數
  if (data.on && data.rows.length) {
    if (data.playing) {
      data.pos += dt * 1.25 * +document.getElementById('spdSel').value;
      if (data.pos >= data.rows.length - 1) { data.pos = data.rows.length - 1; setPlaying(false); }
    }
    const v = valueAt(data.pos);
    paramsFromIndex(v);
    target.nino = Math.max(-1, Math.min(1, v / 2.5));
    const i = Math.round(data.pos);
    const key = i + data.col;
    if (key !== lastPanelKey) {
      lastPanelKey = key; renderPanel();
      const vi = data.vals[i];
      readout.innerHTML = `<b>${data.rows[i].label}</b>　${Number.isFinite(vi) ? (vi > 0 ? '+' : '') + vi.toFixed(1) + ' °C' : '—'}　${dataPhase(i).txt}`;
    }
    if (Math.abs(data.pos - lastDrawnPos) > 0.05) { lastDrawnPos = data.pos; drawTimeline(); }
  }

  // 參數平滑過渡（約 3 秒）
  const k = 1 - Math.exp(-dt * (data.on ? 2.5 : 1.3));
  for (const key in target) cur[key] += (target[key] - cur[key]) * k;

  // 海洋 uniform
  oceanUniforms.uTime.value = simTime;
  oceanUniforms.uSeaTilt.value = cur.seaTilt;
  oceanUniforms.uWarmEdge.value = cur.warmEdge;
  oceanUniforms.uWestT.value = cur.westT;
  oceanUniforms.uEastT.value = cur.eastT;
  oceanUniforms.uThW.value = cur.thermoW;
  oceanUniforms.uThE.value = cur.thermoE;
  oceanUniforms.uShowSST.value = show.sst ? 1 : 0;
  oceanUniforms.uNinoAmp.value = cur.nino * 2.5;          // 狀態模式 ±2.5 °C；資料模式約等於指數值
  ninoBox.visible = show.sst;

  // 信風
  windMesh.visible = show.wind;
  if (show.wind) updateWind(dt);

  // 沃克環流
  const loops = [[walkerA, 6.8, cur.walkerA], [walkerB, -7.2, cur.walkerB]];
  for (const [pts, xEnd, str] of loops) {
    pts.visible = show.walker && str > 0.03;
    if (!pts.visible) continue;
    pts.material.opacity = Math.min(1, str) * 0.9;
    const pos = pts.geometry.attributes.position.array, col = pts.geometry.attributes.color.array;
    const { u, z, j } = pts.userData;
    const x0 = cur.convX, span = xEnd - x0;
    for (let i = 0; i < u.length; i++) {
      u[i] = (u[i] + dt * 0.045 * (0.4 + str) * 8 / Math.max(3, Math.abs(span))) % 1;
      walkerPos(u[i], x0, xEnd, 1.15 + j[i], 5.3 + j[i], tmp);
      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = z[i];
      const f = Math.min(1, Math.max(0, (tmp.x - x0) / span));
      col[i * 3] = RISE.r + (SINK.r - RISE.r) * f;
      col[i * 3 + 1] = RISE.g + (SINK.g - RISE.g) * f;
      col[i * 3 + 2] = RISE.b + (SINK.b - RISE.b) * f;
    }
    pts.geometry.attributes.position.needsUpdate = true;
    pts.geometry.attributes.color.needsUpdate = true;
  }

  // 對流雲與降雨
  cloud.visible = rain.visible = show.cloud;
  if (show.cloud) {
    updateCloud();
    const sc = 0.6 + 0.4 * cur.conv, base = 2.5 * sc;
    rainMat.opacity = Math.min(0.6, 0.32 * cur.conv);
    const a = rainGeo.attributes.position.array;
    rainP.forEach((p, i) => {
      p.y -= dt * 7;
      if (p.y < 0) p.y += base;
      const x = cur.convX + p.dx * sc;
      a.set([x, p.y, p.z * sc, x - 0.04, p.y + 0.35, p.z * sc], i * 6);
    });
    rainGeo.attributes.position.needsUpdate = true;
  }

  // 表層洋流（剖面暖水層中）
  curPts.visible = upPts.visible = show.current;
  if (show.current) {
    const a = curGeo.attributes.position.array;
    curP.forEach((p, i) => {
      p.x += windAt(p.x) * dt * 0.9;
      p.life -= dt;
      if (p.x < CX0 || p.x > CX1 || p.life < 0) { p.x = rand(CX0, CX1); p.life = rand(3, 6); }
      const s = seaH(p.x), d = thermoD(p.x);
      a.set([p.x, Math.max(s - p.r * (s - d) - 0.05, secTerrain(p.x) + 0.1), SEC_Z], i * 3);
    });
    curGeo.attributes.position.needsUpdate = true;
    // 湧升流：深層冷水沿南美大陸坡上升，再於表層向西
    upMat.opacity = Math.min(1, cur.upwell) * 0.9;
    const b = upGeo.attributes.position.array;
    upP.forEach((p, i) => {
      p.s = (p.s + dt * 0.1 * (0.3 + cur.upwell)) % 1;
      let x, y;
      if (p.s < 0.6) {
        const t = p.s / 0.6;
        x = 5.6 + 1.9 * t + p.xo;
        y = -4.2 + (seaH(x) - 0.15 + 4.2) * Math.pow(t, 0.8);
        y = Math.max(y, secTerrain(x) + 0.12);
      } else {
        const t = (p.s - 0.6) / 0.4;
        x = 7.5 + p.xo - t * 3.8 * Math.min(1.2, 0.4 + cur.upwell * 0.6);
        y = seaH(x) - 0.12 - p.yo;
      }
      b.set([x, y, SEC_Z + 0.01], i * 3);
    });
    upGeo.attributes.position.needsUpdate = true;
  }

  // 陸域植被與火災
  const wf = show.veg ? cur.westVeg : 1, ef = show.veg ? cur.eastVeg : 0;
  updateTerrainColors(wf, ef);
  westTrees.visible = eastShrubs.visible = show.veg;
  if (Math.abs(wf - lastTreeF[0]) > 0.004 || Math.abs(ef - lastTreeF[1]) > 0.004) {
    lastTreeF = [wf, ef];
    westTrees.userData.update(0.85 + 0.15 * wf, wf);
    eastShrubs.userData.update(0.05 + 0.95 * ef, ef);
  }
  const fireStr = show.veg ? Math.max(0, 0.6 - cur.westVeg) / 0.6 : 0;
  fire.visible = fireStr > 0.02;
  fireMat.opacity = fireStr;
  if (fire.visible) {
    const a = fireGeo.attributes.position.array;
    fireBase.forEach((p, i) => {
      p.life = (p.life + dt * rand(0.6, 1.4)) % 1;
      a.set([p.x + rand(-0.03, 0.03), p.h + 0.1 + p.life * 0.9, p.z], i * 3);
    });
    fireGeo.attributes.position.needsUpdate = true;
  }

  // 世界地圖與事件地點
  worldMap.visible = show.map;
  for (const pl of Object.values(PLACES)) {
    pl.group.visible = show.map;
    if (!show.map) continue;
    const on = !!PLACES && data.on && NEWS.some(e => PLACES[e.place] === pl && e.idx >= 0 && Math.abs(e.idx - data.pos) <= 4);
    const s = on ? 1.5 + 0.2 * Math.sin(simTime * 5) : 1;
    pl.group.scale.set(s, 1, s);
    pl.mat.emissiveIntensity = on ? 2.5 : 1;
  }

  // Niño 3.4 指標
  ninoMarker.style.left = ((cur.nino + 1) / 2 * 100) + '%';

  // 相機移動
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + realDt / 1.2);
    const e = camTween.t * camTween.t * (3 - 2 * camTween.t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(tick);
}

try { loadData(document.getElementById('ensoCsv').textContent, 'NOAA CPC'); }
catch (err) { console.error(err); }
setState('neutral');
tick();
